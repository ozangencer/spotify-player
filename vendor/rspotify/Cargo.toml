[package]
edition = "2021"
rust-version = "1.56"
name = "rspotify"
version = "0.15.3"
authors = [
    "Ramsay Leung <ramsayleung@gmail.com>",
    "Mario Ortiz Manero <marioortizmanero@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Spotify API wrapper"
homepage = "https://github.com/ramsayleung/rspotify"
readme = "README.md"
keywords = [
    "spotify",
    "api",
]
categories = [
    "api-bindings",
    "multimedia::audio",
]
license = "MIT"
repository = "https://github.com/ramsayleung/rspotify"

[package.metadata.docs.rs]
features = [
    "cli",
    "env-file",
    "client-ureq",
]
